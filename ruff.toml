line-length = 100
output-prefer-rule-codes = true
preview = true
target-version = "py311"

[format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[lint]
future-annotations = true
ignore = [
  "ANN401",
  "BLE001",
  "C901",
  "COM812",
  "CPY001",
  "D100",
  "D102",
  "D103",
  "D104",
  "D107",
  "D403",
  "DOC201",
  "DOC402",
  "DOC501",
  "E501",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0914",
  "PLR0915",
  "PLR0916",
  "PLR0917",
  "PLR1702",
  "PLW0717",
  "RUF001",
  "RUF105",
  "RUF201",
  "S110",
  "S404",
  "SIM105",
  "SIM110",
  "pytest-fixture-autouse",
]
select = ["ALL"]
unfixable = ["RUF027", "T"]

[lint.per-file-ignores]
"src/djlint/rules/*" = ["ARG001", "N999"]
"tests/*" = ["FBT001", "S101", "T201", "PLR2004"]

[lint.flake8-self]
ignore-names = ["_name_", "_value_"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-type-checking]
exempt-modules = []
strict = true

[lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[lint.pydocstyle]
convention = "google"
