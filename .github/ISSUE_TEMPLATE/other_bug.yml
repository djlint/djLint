name: 🦠 Other Bug Report
description: >-
  A bug outside the formatter and the linter: CLI, configuration, Python
  API, install and so on.
title: "[BUG] "
labels: [":microbe: bug"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: >-
            I searched the [existing
            issues](https://github.com/djlint/djLint/issues?q=is%3Aissue)
            and found nothing about this.
          required: true
        - label: >-
            I can reproduce this on the [latest
            release](https://pypi.org/project/djlint/) of djLint.
          required: true
        - label: "I read the [docs](https://djlint.com/docs/getting-started/)."
          required: true
  - type: textarea
    id: description
    attributes:
      label: Issue
      description: A clear and concise description of what is wrong.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Command line
        - Configuration
        - JSON schema
        - Python API
        - Output formats (SARIF, GitHub)
        - pre-commit hooks
        - Installation
        - Online playground
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The commands or code that show the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output of djLint, with the full traceback for a crash.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >-
        Your `djlint.toml`, `.djlintrc` or `[tool.djlint]` section of
        `pyproject.toml`.
      render: text
  - type: dropdown
    id: runner
    attributes:
      label: "How do you run djLint?"
      options:
        - Command line
        - pre-commit
        - Python API
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: djLint version
      description: "`djlint --version`"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      description: "`python --version`"
      placeholder: 3.14.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
