name: CI
on:
  push:
    branches:
      - master
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - linkcheck
      - pre-commit
      - pytest
    runs-on: ubuntu-26.04
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
  linkcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --index-files index.html
            --root-dir ${{ github.workspace }}/docs/_site
            docs/_site
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      # uvx and the hook environments prek installs read neither pyproject.toml
      # nor .npmrc, so their dependency cooldown is set here.
      - run: uvx --no-cache prek run --all-files --show-diff-on-failure
        env:
          NPM_CONFIG_MIN_RELEASE_AGE: "3" # days
          RUFF_OUTPUT_FORMAT: github
          UV_EXCLUDE_NEWER: 3 days
  pytest:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.15"
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: true
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - run: uv run --group test-ci --no-group dev --locked pytest
