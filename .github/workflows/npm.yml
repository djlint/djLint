name: npm
on:
  workflow_call:
    inputs:
      packages:
        description: >-
          The artifact with the packages to test. Without it, each job builds
          the one for its platform with the pure wheel, as compiling one takes
          minutes.
        type: string
        default: ""
permissions: {}
jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: macos-26
            platform: darwin-arm64
          - os: macos-26-intel
            platform: darwin-x64
          - os: ubuntu-26.04-arm
            platform: linux-arm64-gnu
          # The runners have glibc, so the musl builds run in Alpine.
          - os: ubuntu-26.04-arm
            platform: linux-arm64-musl
            image: node:{node}-alpine
          # No runner has these processors, so QEMU runs their tests.
          - os: ubuntu-26.04
            platform: linux-ppc64-gnu
            image: node:{node}
            qemu: linux/ppc64le
          - os: ubuntu-26.04
            platform: linux-riscv64-gnu
            # Node has no image for riscv64, so its unofficial build runs in
            # Debian, which has to add the libatomic it needs.
            image: debian:trixie-slim
            qemu: linux/riscv64
            node-build: linux-riscv64
            setup: >-
              apt-get update -qq &&
              apt-get install -qq -y --no-install-recommends libatomic1 > /dev/null
          - os: ubuntu-26.04
            platform: linux-s390x-gnu
            image: node:{node}
            qemu: linux/s390x
          - os: ubuntu-26.04
            platform: linux-x64-gnu
          - os: ubuntu-26.04
            platform: linux-x64-musl
            image: node:{node}-alpine
          - os: windows-11-vs2026-arm
            platform: win32-arm64
          # Node has no 32-bit Windows builds after 22.
          - os: windows-2025
            platform: win32-ia32
            node: "22"
            architecture: x86
          - os: windows-2025
            platform: win32-x64
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The oldest Node the launcher runs on, which one platform is enough to try.
      - id: oldest-node
        if: ${{ matrix.platform == 'linux-x64-gnu' }}
        run: |
          target=$(jq -er '.scripts["esbuild-launcher"] | capture("--target=node(?<v>[0-9]+(\\.[0-9]+){0,2})\\b").v' package.json) ||
            { echo "::error::the esbuild-launcher script in package.json has no --target=node"; exit 1; }
          # setup-node takes 16.9 as the newest 16.9.x, and the oldest is wanted.
          until [[ $target =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; do target+=.0; done
          echo "version=$target" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.oldest-node.outputs.version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.oldest-node.outputs.version }}
          package-manager-cache: false
      - id: oldest-node-path
        if: ${{ steps.oldest-node.outputs.version }}
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ !matrix.node && '.nvmrc' || '' }}
          architecture: ${{ matrix.architecture }}
          check-latest: true
          package-manager-cache: false
      # Python, the wheels and Node for riscv64, each checked against a hash
      # fetched anew. Only master saves it, and a release builds without it.
      - id: downloads
        if: ${{ !inputs.packages }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: npm/dist/downloads
          key: npm-${{ matrix.platform }}-${{ hashFiles('npm/build.py', 'uv.lock', '.nvmrc') }}
      # The build script asks for the Python it compiles the bytecode with.
      - if: ${{ !inputs.packages }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            npm/build.py
          cache-python: true
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      # esbuild, which builds the launcher.
      - if: ${{ !inputs.packages }}
        run: npm ci
      - if: ${{ !inputs.packages }}
        run: uv build --wheel --out-dir wheels
      - if: ${{ !inputs.packages }}
        run: uv run npm/build.py wheels "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
      - if: ${{ inputs.packages }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.packages }}
          path: npm/dist
      - if: ${{ matrix.node-build }}
        run: |
          base=https://unofficial-builds.nodejs.org/download/release
          read -r version build < <(
            curl -fsSL "$base/index.json" | jq -r --arg major "v$(cat .nvmrc)." --arg build "$BUILD" \
              'first(.[] | select(.version | startswith($major)) | .version as $version
                | .files[] | select(startswith($build)) | "\($version) \(.)")'
          )
          archive=node-$version-$build.tar.xz
          mkdir -p npm/dist/downloads node
          cd npm/dist/downloads
          [ -f "$archive" ] || curl -fsSL -o "$archive" "$base/$version/$archive"
          curl -fsSL "$base/$version/SHASUMS256.txt" | grep " $archive\$" | sha256sum --check --strict -
          tar -xJf "$archive" -C "$GITHUB_WORKSPACE/node" --strip-components=1
        env:
          BUILD: ${{ matrix.node-build }}
      - if: ${{ !inputs.packages && github.ref == 'refs/heads/master' && steps.downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: npm/dist/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # It runs privileged, so it is pinned, and not kept in a cache a
          # release would read.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
          platforms: ${{ matrix.qemu }}
      - if: ${{ !matrix.image }}
        run: node --test npm/test.ts
        env:
          DJLINT_OLDEST_NODE: ${{ steps.oldest-node-path.outputs.path }}
          DJLINT_PLATFORM: ${{ matrix.platform }}
      # Node from node-build comes in on the PATH; an image has its own.
      - if: ${{ matrix.image }}
        run: |
          image=${IMAGE/'{node}'/$(cat .nvmrc)}
          docker run --rm ${QEMU:+--platform "$QEMU"} --env DJLINT_PLATFORM --env SETUP \
            --volume "$PWD:/djlint" --workdir /djlint "$image" \
            sh -c 'eval "${SETUP:-:}" && PATH="/djlint/node/bin:$PATH" exec node --test npm/test.ts'
        env:
          DJLINT_PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
          QEMU: ${{ matrix.qemu }}
          SETUP: ${{ matrix.setup }}
