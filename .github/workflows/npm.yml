name: npm
on:
  workflow_call:
    inputs:
      packages:
        description: >-
          The artifact with the packages to test. Without it, each job builds
          the one for its platform with the pure wheel, as compiling one takes
          minutes.
        type: string
        default: ""
permissions: {}
jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: macos-26
            platform: darwin-arm64
          - os: macos-26-intel
            platform: darwin-x64
          - os: ubuntu-26.04-arm
            platform: linux-arm64-gnu
          # The runners have glibc, so the musl builds run in Alpine.
          - os: ubuntu-26.04-arm
            platform: linux-arm64-musl
            image: node:{node}-alpine
          # No runner has these processors, so QEMU runs their tests.
          - os: ubuntu-26.04
            platform: linux-ppc64-gnu
            image: node:{node}
            qemu: linux/ppc64le
          - os: ubuntu-26.04
            platform: linux-riscv64-gnu
            # Node has no image for riscv64, and Debian has Node.
            image: debian:trixie-slim
            qemu: linux/riscv64
            setup: apt-get update -qq && apt-get install -qq -y nodejs npm > /dev/null
          - os: ubuntu-26.04
            platform: linux-s390x-gnu
            image: node:{node}
            qemu: linux/s390x
          - os: ubuntu-26.04
            platform: linux-x64-gnu
          - os: ubuntu-26.04
            platform: linux-x64-musl
            image: node:{node}-alpine
          - os: windows-11-vs2026-arm
            platform: win32-arm64
          # Node has no 32-bit Windows builds after 22.
          - os: windows-2025
            platform: win32-ia32
            node: "22"
            architecture: x86
          - os: windows-2025
            platform: win32-x64
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ !matrix.node && '.nvmrc' || '' }}
          architecture: ${{ matrix.architecture }}
          check-latest: true
          package-manager-cache: false
      # The build script asks for the Python it compiles the bytecode with.
      - if: ${{ !inputs.packages }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - if: ${{ !inputs.packages }}
        run: uv build --wheel --out-dir wheels --no-cache
      - if: ${{ !inputs.packages }}
        run: uv run --no-cache npm/build.py wheels "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
      - if: ${{ inputs.packages }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.packages }}
          path: npm/dist
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.qemu }}
      - if: ${{ !matrix.image }}
        run: node --test npm/test.mjs
        env:
          DJLINT_PLATFORM: ${{ matrix.platform }}
      - if: ${{ matrix.image }}
        run: |
          image=${IMAGE/'{node}'/$(cat .nvmrc)}
          docker run --rm ${QEMU:+--platform "$QEMU"} --env DJLINT_PLATFORM \
            --volume "$PWD:/djlint" --workdir /djlint "$image" \
            sh -c "${SETUP:+$SETUP && }node --test npm/test.mjs"
        env:
          DJLINT_PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
          QEMU: ${{ matrix.qemu }}
          SETUP: ${{ matrix.setup }}
