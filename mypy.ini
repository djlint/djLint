[mypy]
python_version = 3.11
disallow_any_unimported = True
disallow_untyped_calls = False
warn_unreachable = True
allow_redefinition = True
enable_error_code =
  deprecated,
  exhaustive-match,
  explicit-override,
  ignore-without-code,
  mutable-override,
  possibly-undefined,
  redundant-expr,
  redundant-self,
  truthy-bool,
  truthy-iterable,
  unimported-reveal,
  unused-awaitable,
  unused-ignore
strict_equality_for_none = True
strict = True

[mypy-cssbeautifier.*,jsbeautifier.*]
follow_untyped_imports = True
