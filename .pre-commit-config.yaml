repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-xml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 3338d92255ee53d31bd0f5d0bac85f355418c36b # frozen: v1.11.0
    hooks:
      - id: tombi-format
        exclude: ^uv.lock$
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: 9d4396bc7213c9392d3ee75974bbf2bfa34bfe29 # frozen: v0.77.0
    hooks:
      - id: oxfmt
        language: node
        types_or:
          - text
        args:
          - --no-error-on-unmatched-pattern
        additional_dependencies:
          - oxfmt@0.77.0
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c # frozen: v2.4.1
    hooks:
      - id: mypy
        language: python
        args:
          - --scripts-are-modules
        additional_dependencies:
          - click==8.5.1
          - cssbeautifier==2.0.3
          - jsbeautifier==2.0.3
          - json5==0.17.3
          - pathspec==1.1.1
          - pytest==9.2.0
          - types-pyyaml==6.0.12.20261103
          - types-regex==2026.11.7.20261108
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        args: [--no-progress, --persona=pedantic]
