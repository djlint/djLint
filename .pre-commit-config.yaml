repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-xml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 10da57f75d36ba93b257a4e7f2c70796fa2da683 # frozen: v1.9.8
    hooks:
      - id: tombi-format
        exclude: ^uv.lock$
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: 1fb54d06ff80b555a6a428d9b12ff0796e67d923 # frozen: v0.74.0
    hooks:
      - id: oxfmt
        types_or:
          - text
        args:
          - --no-error-on-unmatched-pattern
        additional_dependencies:
          - oxfmt@0.75.0
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c # frozen: v2.4.1
    hooks:
      - id: mypy
        language: python
        args:
          - --scripts-are-modules
        additional_dependencies:
          - click==8.5.0
          - cssbeautifier==2.0.3
          - jsbeautifier==2.0.3
          - json5==0.17.3
          - pathspec==1.1.1
          - pytest==9.2.0
          - types-pyyaml==6.0.12.20260906
          - types-regex==2026.9.29.20261017
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --persona=pedantic]
