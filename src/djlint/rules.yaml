- rule:
    name: T001
    message: Variables should be wrapped in a whitespace.
    exclude:
      - handlebars
      - golang
    python_module: djlint.rules.T001
- rule:
    name: T002
    message: Double quotes should be used in tags.
    python_module: djlint.rules.T002
- rule:
    name: T003
    message: "Endblock should have name. Ex: {% endblock body %}."
    default: false
    python_module: djlint.rules.T003
- rule:
    name: D004
    skip_in_attributes: true
    message: (Django) Static urls should follow {% static path/to/file %} pattern.
    flags: re.DOTALL
    # this should be using the static path from django settings
    patterns:
      - <(?:link|img|script|source)\s(?:\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{\#[^\#]*\#}|[^'\">{}])*?(?<![-.:\w])(?:href|src|srcset)=[\"\']/?static/?
- rule:
    name: J004
    skip_in_attributes: true
    message: (Jinja) Static urls should follow {{ url_for('static'..) }} pattern.
    flags: re.DOTALL
    # this should be using the static path from django settings
    patterns:
      - <(?:link|img|script|source)\s(?:\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{\#[^\#]*\#}|[^'\">{}])*?(?<![-.:\w])(?:href|src|srcset)=[\"\']/?static/?
- rule:
    name: H005
    message: Html tag should have a non-empty lang attribute.
    flags: re.DOTALL|re.I
    patterns:
      # "(?![\w-])" keeps a custom element such as <html-midi-player> out
      - <html(?![\w-])(?:"[^"]*"|'[^']*'|(?!(?<![-.:\w])lang\s*=)[^'">])*>
      # lang="" names no language
      - <html(?![\w-])(?:"[^"]*"|'[^']*'|[^'">])*?(?<![-.:\w])lang\s*=\s*(?:""|'')(?:"[^"]*"|'[^']*'|[^'">])*>
- rule:
    name: H006
    skip_in_attributes: true
    message: Img tag should have height and width attributes.
    default: false
    flags: re.DOTALL|re.I
    patterns:
      - <img\b(?:"[^"]*"|'[^']*'|(?!(?<![-.:\w])height\s*=)[^'">])*/?>
      - <img\b(?:"[^"]*"|'[^']*'|(?!(?<![-.:\w])width\s*=)[^'">])*/?>
- rule:
    name: H007
    message: <!DOCTYPE ... > should be present before the html tag.
    flags: re.DOTALL|re.I
    patterns:
      # anything else before the html tag is junk to step over, not a reason
      # to stop looking
      - '^(?!(?:\s+|<!--.*?-->|{\#.*?\#}|{%.*?%}|{{.*?}}|<\?.*?\?>|<!(?!doctype\b)[^>]*>)*<!doctype\b)(?:\s+|<!--.*?-->|{\#.*?\#}|{%.*?%}|{{.*?}}|<\?.*?\?>|<!(?!doctype\b)[^>]*>)*\K<html(?![\w-])'
- rule:
    name: H008
    message: Attributes should be double quoted.
    flags: re.DOTALL|re.I
    patterns:
      # a value holding a double quote has to keep its single quotes, and
      # the name must start on a name boundary so data-title is not title
      - <(?:\w+)\b(\"[^\"]*\"|'[^']*'|{[^}]*}|[^'\">{}])*(?<![-.:\w])(?:class|id|src|width|height|alt|style|lang|title|srcset|media)\s*='[^'\"]*'
- rule:
    name: H009
    message: Tag names should be lowercase.
    python_module: djlint.rules.H009
- rule:
    name: H010
    message: Attribute names should be lowercase.
    flags: re.DOTALL
    patterns:
      # a quoted value is stepped over whole, so an uppercase name written
      # inside one (title="the ID=5") is not read as an attribute name. No
      # name boundary here: data-ID is an uppercase name and does count.
      - <\w+(?:"[^"]*"|'[^']*'|[^'">])+?(?:CLASS|ID|SRC|WIDTH|HEIGHT|ALT|STYLE|LANG|TITLE|MEDIA|SRCSET)=
- rule:
    name: H011
    skip_in_attributes: true
    message: Attribute values should be quoted.
    flags: re.DOTALL|re.I|re.M|re.X
    patterns:
      - |
        <(?:(?!meta)\w+)\b(\"[^\"]*\"|'[^']*'|{[^}]*}|[^'\">{}])*(?:class|id|src|width|height|alt|style|lang|title|href|action|method|checked|required|srcset)=[a-zA-Z_-]+
      - <(?:meta)\s+?[^>]*?(?:class|id|src|alt|style|lang|title|href|action|method|name)=[a-zA-Z_-]+
- rule:
    name: H012
    message: There should be no spaces around attribute =.
    flags: re.DOTALL
    patterns:
      - <\w+?(\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{\#[^\#]*\#}|{[^}]*}|[^'\">{}])*\s+=
      - <\w+?(\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{\#[^\#]*\#}|{[^}]*}|[^'\">{}])*=\s
- rule:
    name: H013
    skip_in_attributes: true
    message: Img tag should have an alt attribute.
    flags: re.DOTALL|re.I
    patterns:
      # a quoted value is stepped over whole, and the name must start on a
      # name boundary, so neither title="alt=x" nor data-alt counts as alt
      - <img\b(?:"[^"]*"|'[^']*'|(?!(?<![-.:\w])alt\b)[^'">])*/?>
- rule:
    name: H014
    message: Found extra blank lines.
    python_module: djlint.rules.H014
- rule:
    name: H015
    message: Follow h tags with a line break.
    flags: re.DOTALL
    patterns:
      - </h\d?>(?:(?!(.+\r?\n){1,}).)*<[a-zA-Z]+\d?
- rule:
    name: H016
    message: Missing title tag in html.
    python_module: djlint.rules.H016
- rule:
    name: H017
    skip_in_attributes: true
    message: Void tags should be self closing.
    flags: re.DOTALL|re.I
    default: false
    patterns:
      - <(img|input|area|base|br|col|embed|hr|link|meta|param|source|track|wbr|path)((?!\w|-)(\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{#[^#]*#}|[^'\">{}])*)(?<!/)>
- rule:
    name: H018
    skip_in_attributes: true
    message: Void tags are self closing by nature and must end with ">", not "/>"
    flags: re.DOTALL|re.I
    default: false
    patterns:
      - <(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)((?!\w|-)(\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{#[^#]*#}|[^'\">{}])*)/>
- rule:
    name: D018
    message: (Django) Internal links should use the {% url ... %} pattern.
    flags: re.DOTALL|re.I
    patterns:
      # the value has to look like a path, so a data-src holding a word such
      # as "lazy" is not read as a link, and padding is stepped over so a
      # spaced {% url %} is not reported as a hardcoded one
      - <(?:a|div|span|input)\b(\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{#[^#]*#}|[^'\">{}])*?\s(?:href|data-url|data-src|action)\s*=["']\s*(?!(?:[a-z][a-z0-9+.-]*:|//|/?(?:static|media)/|/["']))(?:/[\w/.-]*|[\w.-]+/[\w/.-]*)
      - <form\b(\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{#[^#]*#}|[^'\">{}])*?\saction\s*=["']\s*(?!(?:[a-z][a-z0-9+.-]*:|//|/?(?:static|media)/|/["']))(?:/[\w/.-]*|[\w.-]+/[\w/.-]*)
- rule:
    name: J018
    message: (Jinja) Internal links should use the {{ url_for() ... }} pattern.
    flags: re.DOTALL|re.I
    patterns:
      # the value has to look like a path, so a data-src holding a word such
      # as "lazy" is not read as a link, and padding is stepped over so a
      # spaced {% url %} is not reported as a hardcoded one
      - <(?:a|div|span|input)\b(\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{#[^#]*#}|[^'\">{}])*?\s(?:href|data-url|data-src|action)\s*=["']\s*(?!(?:[a-z][a-z0-9+.-]*:|//|/?(?:static|media)/|/["']))(?:/[\w/.-]*|[\w.-]+/[\w/.-]*)
      - <form\b(\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{#[^#]*#}|[^'\">{}])*?\saction\s*=["']\s*(?!(?:[a-z][a-z0-9+.-]*:|//|/?(?:static|media)/|/["']))(?:/[\w/.-]*|[\w.-]+/[\w/.-]*)
- rule:
    name: H019
    skip_in_attributes: true
    message: Replace 'javascript:abc()' with on_ event and real url.
    flags: re.DOTALL|re.I
    patterns:
      - '<(?:a|div|span|input)\s(?:\"[^\"]*\"|''[^'']*''|{{[^}]*}}|{%[^%]*%}|{\#[^\#]*\#}|[^''\">{}])*?(?<![-.:\w])(?:href|data-url)\s*=["'']javascript:'
      - '<form\s(?:\"[^\"]*\"|''[^'']*''|{{[^}]*}}|{%[^%]*%}|{\#[^\#]*\#}|[^''\">{}])*?(?<![-.:\w])action\s*=["'']javascript:'
- rule:
    name: H020
    skip_in_attributes: true
    message: Empty tag pair found. Consider removing.
    flags: re.DOTALL|re.I
    patterns:
      # an element whose empty form carries meaning is left alone: a blank
      # <option> holds a select open, a <tbody> is a script's target, and a
      # <canvas> or <template> is filled in at runtime. The names are
      # anchored, so <theadx> is not read as <thead>.
      - <((?!(?:td|th|tr|li|dt|dd|slot|option|optgroup|tbody|thead|tfoot|colgroup|canvas|noscript|template|iframe|textarea|script|style|svg|g|defs|mask|marker|symbol|pattern|clippath|video|audio|object|picture|body|head)\b)\w+)\s*?>\s*?<\/\1>
- rule:
    name: H021
    skip_in_attributes: true
    message: Inline styles should be avoided.
    flags: re.I|re.DOTALL
    patterns:
      - <\w+\s(?:\"[^\"]*\"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{\#[^\#]*\#}|[^'\">{}])*?(?<![-.:\w])style\s*=
- rule:
    name: H022
    skip_in_attributes: true
    message: Use HTTPS for external links.
    flags: re.I
    patterns:
      # a quoted value is stepped over whole, so an "http://" written inside
      # one is not read as a link; a loopback or private host is not external
      - <\w+\s(?:\"[^\"]*\"|'[^']*'|[^'\">])*?(?<![-.:\w])(?:href|data-url|action|src|url|srcset)\s*=[\"']http://(?!localhost[:/\"']|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|10\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.|[^\"'/]*\.(?:local|test|localhost)[:/\"'])
- rule:
    name: H023
    message: Do not use entity references.
    flags: re.I|re.X
    patterns:
      - |-
        &(?!(?:
             lt|gt|amp|quot|apos|lbrace|rbrace|lcub|rcub
           | nbsp|ensp|emsp|thinsp|hairsp|numsp|puncsp|shy
           | zwnj|zwj|lrm|rlm|zwnbsp
           | \#(?:34|38|39|60|62|123|125|160|173|8194|8195|8201|8202|8203|8204
                 |8205|8206|8207|8232|8233|8239|8287|8288|65279)
           | \#x(?:22|26|27|3c|3e|7b|7d|a0|ad|2002|2003|2009|200a|200b|200c
                  |200d|200e|200f|2028|2029|202f|205f|2060|feff)
          );)[\#0-9a-z]{,30};
- rule:
    name: H024
    message: Omit type on scripts and styles.
    flags: re.I
    patterns:
      - <(?:script|style|link)\b(?:\"[^\"]*\"|'[^']*'|[^'\">])*?(?<![-.:\w])type\s*=[\"'](?:text/css|text/javascript)[\"']
- rule:
    name: H025
    message: Tag seems to be an orphan.
    python_module: djlint.rules.H025
- rule:
    name: H026
    message: Empty id and class tags can be removed.
    flags: re.I
    patterns:
      - <\w+\b(?:\"[^\"]*\"|'[^']*'|{[^}]*}|[^'\">{}])*?\s(class|id)\b=(\"\"|'')
      - <\w+\b(?:\"[^\"]*\"|'[^']*'|{[^}]*}|[^'\">{}])*?\s(class|id)\b(?!\s*=)(?=\s|/?>)
- rule:
    name: T027
    message: Unclosed string found in template syntax.
    python_module: djlint.rules.T027

- rule:
    name: T028
    message: Consider using spaceless tags inside attribute values. {%- if/for -%}
    default: false
    exclude:
      - django
    patterns:
      - <(?:/?(?:\w+)\b(?:\"[^\"]*\"|'[^']*'|{[^}]*}|[^'\">{}/])*(?<!\bclass)=([\"'])(?:(?!\1).)*?({%)[^-])\s*?(?:if|for|else|end)
      - <(?:/?(?:\w+)\b(?:\"[^\"]*\"|'[^']*'|{[^}]*}|[^'\">{}/])*(?<!\bclass)=([\"'])(?:(?!\1).)*?{%(?:(?!%}).)*(?:if|else|for|end)(?:(?!%}).)*[^-](%}))
- rule:
    name: H029
    message: Consider using lowercase form method values.
    patterns:
      # the name must start on a name boundary, so data-method is not method
      - <[fF][oO][rR][mM]\b(?:\"[^\"]*\"|'[^']*'|{[^}]*}|[^'\">{}/])*(?<![-.:\w])([mM][eE][tT][hH][oO][dD])=(([\"'])[a-zA-Z]*?[A-Z][a-zA-Z]*?\3)
- rule:
    name: H030
    message: Consider adding a meta description.
    flags: re.DOTALL|re.I
    patterns:
      # a template tag in the head can render a description djLint cannot
      # see, and a base layout that fills one in per page is the right way
      # to write it, so the rule stays quiet for that file
      - <html(?![\w-])[^>]*?>(?!(?:(?!</head>)[\s\S])*?\{[{%](?:(?!</head>)[\s\S])*?</head>)(?:(?!<meta[^>]*?(?<![-.:\w])name\s*=([\"'])description\b).)*</html>
- rule:
    name: T032
    message: Extra whitespace found in template tags.
    patterns:
      # a string is stepped over whole, so a run of spaces inside one is
      # content rather than padding
      - '{%(?:"[^"]*"|''[^'']*''|(?!%})[^''"\n])*?[ \t]{2,}'
      - '{{(?:"[^"]*"|''[^'']*''|(?!}})[^''"\n])*?[ \t]{2,}'
- rule:
    name: H033
    message: Extra whitespace found in form action.
    patterns:
      - <form\b(\"[^\"]*\"|'[^']*'|[^'\">])*?\saction\s*=(["'])\s
      - <form\b(?:\"[^\"]*\"|'[^']*'|[^'\">])*?\saction\s*=([\"'])({{(?:(?!}}).)*}}|{%(?:(?!%}).)*%}|([^\"'{]))*\s+?\1
- rule:
    name: T034
    message: Did you intend to use {% ... %} instead of {% ... }%?
    flags: re.DOTALL
    patterns:
      # a string is stepped over whole, so a brace inside one is text
      - '{%(?:"[^"]*"|''[^'']*''|(?!%}|}%)[^"''])*}%'
- rule:
    name: H036
    skip_in_attributes: true
    message: Do not use br tags for spacing.
    flags: re.I|re.X
    patterns:
      # a run of breaks is vertical space rather than a break in the content
      - <br\s*/?>(?:\s|&nbsp;|&\#160;)*<br\s*/?>
      # a break against the inside edge of a block box renders nothing that the
      # box's own margin does not
      - |-
        <(?:p|div|li|dd|dt|td|th|section|article|aside|header|footer|main
          |nav|blockquote|figcaption|h[1-6])\b(?:"[^"]*"|'[^']*'|[^>"'])*>
        \s*<br\s*/?>
      - |-
        <br\s*/?>\s*
        </(?:p|div|li|dd|dt|td|th|section|article|aside|header|footer|main
           |nav|blockquote|figcaption|h[1-6])\s*>
- rule:
    name: H037
    message: Duplicate attribute found.
    python_module: djlint.rules.H037
- rule:
    name: T038
    message: Block tag has no matching end tag.
    python_module: djlint.rules.T038
- rule:
    name: T039
    message: Unclosed template tag found.
    python_module: djlint.rules.T039
- rule:
    name: T040
    message: Missing or empty template name in extends or include tag.
    patterns:
      - "{%[-+]?[ \\t]*?(?:extends|include)[ \\t]*?(?:'[ \\t]*'|\"[ \\t]*\")(?![ \\t]*\\|)"
      - "{%[-+]?[ \\t]*?(?:extends|include)[ \\t]*?[-+]?%}"
- rule:
    name: H041
    message: Tag is closed in a different template block than it was opened.
    python_module: djlint.rules.H041
- rule:
    name: H042
    message: Label for attribute has no matching element id in this file.
    python_module: djlint.rules.H042
- rule:
    name: H043
    skip_in_attributes: true
    message: Button tag should have a type attribute.
    flags: re.DOTALL|re.I
    patterns:
      # a quoted value is stepped over whole, and the name must start on a
      # name boundary, so neither title="type=x" nor data-type counts as type
      - <button\b(?:"[^"]*"|'[^']*'|{{[^}]*}}|{%[^%]*%}|{#[^#]*#}|(?!(?<![-.:\w])type\s*=)[^'">{}])*/?>
- rule:
    name: H044
    message: Thead should not mix th and td cells.
    python_module: djlint.rules.H044
